[package]
name = "talkrypt-keyvault"
publish.workspace = true
version = "1.0.0"
edition.workspace = true
license.workspace = true

# Agent-isolated signing microapp (docs/plans/0004-keyvault.md). Owns the entire
# secret lifecycle — passphrase input, Argon2id/PBKDF2 unseal, ML-DSA/SLH-DSA
# signing — inside one hardened process, reading the passphrase from the CONTROLLING
# TERMINAL (/dev/tty), never a stdin an automation agent can pipe. Only PUBLIC data
# (sealed blobs, pubkeys, addresses, signatures) crosses its boundary.
[[bin]]
name = "talkrypt-keyvault"
path = "src/main.rs"

[features]
# The eframe GUI popup front-end. Default so a shipped keyvault has BOTH the GUI and
# the /dev/tty TUI; `--no-default-features` builds a lean TUI-only signer (no
# windowing deps) for headless release hosts.
default = ["gui"]
gui = ["dep:eframe", "dep:egui"]

[dependencies]
# The reusable release-signing crypto: seal (Argon2id/PBKDF2), QRL-2.0 seeds, sign.
talkrypt-relsign = { path = "../relsign" }
# Process hardening (mlock / no-core-dump / anti-ptrace) + the secure RNG.
talkrypt-crypto.workspace = true
# /dev/tty termios (echo-off passphrase entry).
libc.workspace = true
zeroize.workspace = true
# GUI popup (optional) — same native windowing stack as the desktop client. The
# passphrase typed into the window never transits stdin, so a window the agent can't
# observe is the isolation boundary (mirrors the /dev/tty TUI).
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts"], optional = true }
egui = { version = "0.31", optional = true }

# Linux desktop windowing backends — added only when targeting Linux (and only pulled
# when the `gui` feature enables eframe), so macOS/Windows don't pull X11/Wayland.
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.31", default-features = false, features = ["wayland", "x11"], optional = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
