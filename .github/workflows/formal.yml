# Machine-checked formal verification (SECURITY-AUDIT G1/G2/G3/G4/T-1/T-2).
#
# Two independent proof engines:
#   * Kani (bounded model checker) — proves the untrusted-input wire decoders are
#     TOTAL and memory-safe on ALL inputs (no panic/over-read/over-allocate).
#   * F* — machine-checks the group-message authentication theorems (no-forgery,
#     PoP soundness, auth-PCS) by reduction to ML-DSA-87 EUF-CMA (FIPS 204).
name: formal

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    paths:
      - "crates/crypto/**"
      - "crates/wire/**"
      - "formal/**"
      - ".github/workflows/formal.yml"
  pull_request:
    paths:
      - "crates/crypto/**"
      - "crates/wire/**"
      - "formal/**"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  kani:
    name: Kani — decoder totality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Kani
        run: |
          cargo install --locked kani-verifier
          cargo kani setup
      - name: Prove wire decoder (talkrypt-wire) is total
        run: cargo kani -p talkrypt-wire
      - name: Prove group-message + membership decoders are total
        run: cargo kani -p talkrypt-crypto

  fstar:
    name: "F* — auth theorems"
    # Pin 22.04 (glibc 2.35) to match the prebuilt Z3 4.13.3 Linux asset.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      # F* pins an exact Z3 version and looks for it on PATH as `z3-<version>`.
      # opam's F* here wants 4.13.3, so install that release and expose it as both
      # `z3-4.13.3` and `z3` before running F*.
      - name: Install Z3 4.13.3 (the version F* pins)
        run: |
          set -euo pipefail
          curl -fsSL -o z3.zip \
            https://github.com/Z3Prover/z3/releases/download/z3-4.13.3/z3-4.13.3-x64-glibc-2.35.zip
          unzip -q z3.zip
          z3bin="$(find . -type f -path '*/bin/z3' | head -1)"
          test -n "$z3bin"
          sudo install -m 0755 "$z3bin" /usr/local/bin/z3-4.13.3
          sudo install -m 0755 "$z3bin" /usr/local/bin/z3
          z3-4.13.3 --version
      - name: Install F* (via opam)
        run: |
          sudo apt-get update && sudo apt-get install -y opam
          opam init --disable-sandboxing -y
          opam install -y fstar
      - name: Verify GroupAuth.fst
        run: |
          eval $(opam env)
          z3-4.13.3 --version
          make -C formal fstar

  easycrypt:
    name: "EasyCrypt — QROM reductions"
    # Pin 22.04 (glibc 2.35) to match the prebuilt Z3 4.13.3 Linux asset.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      # EasyCrypt's why3 supports Z3 in the ^4.13 range; install 4.13.3 and expose it.
      - name: Install Z3 4.13.3
        run: |
          set -euo pipefail
          curl -fsSL -o z3.zip \
            https://github.com/Z3Prover/z3/releases/download/z3-4.13.3/z3-4.13.3-x64-glibc-2.35.zip
          unzip -q z3.zip
          z3bin="$(find . -type f -path '*/bin/z3' | head -1)"
          test -n "$z3bin"
          sudo install -m 0755 "$z3bin" /usr/local/bin/z3-4.13.3
          sudo install -m 0755 "$z3bin" /usr/local/bin/z3
          z3 --version
      - name: Install EasyCrypt (via opam)
        run: |
          sudo apt-get update && sudo apt-get install -y opam
          opam init --disable-sandboxing -y
          opam install -y easycrypt
      - name: Configure provers and verify the QROM reductions
        run: |
          eval $(opam env)
          easycrypt why3config
          make -C formal easycrypt
