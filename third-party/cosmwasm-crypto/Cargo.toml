# TALKRYPT PATCH: ecdsa 0.16 -> 0.17 / k256 0.13 -> 0.14 / p256 0.13 -> 0.14 /
# moves cosmwasm's secp256k1/secp256r1 verify+recover onto the released EC stack
# that rides crypto-bigint 0.7.6+ (clears RUSTSEC-2026-0387). ed25519-zebra =4.0.3
# -> 5.0.0 and rand_core -> 0.10 (the pair zebra 5 uses) so there's no rand_core
# 0.6 holdout. `ed25519_batch_verify`'s RNG bound + the zebra 5 batch API are
# updated accordingly in src/ed25519.rs.
# cosmwasm-crypto is a thin verify/recover wrapper; correctness re-checked by its
# own wycheproof + rootberg KAT suites. See TALKRYPT-PATCH.md.
[dependencies.ecdsa]
version = "0.17"

[dependencies.ed25519-zebra]
version = "5.0.0"
# zebra 5 gates its `batch` module behind `alloc` (was unconditional in 4.x).
features = ["alloc"]
default-features = false

[dependencies.k256]
version = "0.14"
features = ["ecdsa"]
default-features = false

[dependencies.num-traits]
version = "0.2.18"

[dependencies.p256]
version = "0.14"
features = ["ecdsa"]
default-features = false

[dependencies.rand_core]
version = "0.10"

[dependencies.rayon]
version = "1.9.0"

[dependencies.sha2]
version = "0.10"

[dependencies.thiserror]
version = "1.0.26"

[dev-dependencies.base64]
version = "0.22.0"

[dev-dependencies.base64-serde]
version = "0.7.0"

[dev-dependencies.criterion]
version = "0.5.1"

[dev-dependencies.english-numbers]
version = "0.3"

[dev-dependencies.glob]
version = "0.3.1"

[dev-dependencies.hex]
