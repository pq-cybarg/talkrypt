# TALKRYPT PATCH: reqwest 0.11 -> 0.13 to drop the RUSTSEC-flagged old TLS stack
# (rustls 0.21, rustls-webpki 0.101, h2 0.3) that reqwest 0.11 dragged in. reqwest
# 0.13 rides the modern rustls 0.23 / h2 0.4 already in this workspace (and the
# exact reqwest 0.13.4 nym itself already uses elsewhere), so this UNIFIES the tree
# rather than adding a version. The 0.13 `rustls` feature = aws-lc-rs provider +
# rustls-platform-verifier + http, the drop-in successor to 0.11's
# `rustls-tls-native-roots`. See third-party/tendermint-rpc/TALKRYPT-PATCH.md.
