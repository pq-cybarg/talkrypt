# cargo-deny configuration — supply-chain policy for the talkrypt workspace.
# Run via `scripts/audit-deps.sh` or `cargo deny check`. Gates CI (SECURITY-AUDIT
# R-1 / F-2): a new advisory, a disallowed license, or a non-crates.io source
# fails the build. Tune the few `allow`/`ignore` lists below with a comment
# justifying each entry — never ignore an advisory silently.

[advisories]
# Use the default RustSec advisory DB. Any unfixed vulnerability fails.
version = 2
yanked = "deny"
# Per-advisory exceptions, each justified. NB: advisory tooling matches by crate
# name + version, so it cannot see source patches — an entry here may document a
# *fixed* (locally patched) dependency, not an accepted-as-is risk.
ignore = [
  # rsa 0.9.10 — RUSTSEC-2023-0071 (Marvin timing attack). FIXED LOCALLY: rsa is
  # vendored + source-patched to blind every private-key operation
  # (third-party/rsa/TALKRYPT-PATCH.md), applied via [patch.crates-io]. rsa is
  # also tor-feature-only and absent from default builds. The advisory still
  # matches by version; this entry records the fix, not an unmitigated risk.
  "RUSTSEC-2023-0071",

  # ---- Nym-feature-only advisories (the `nym` mixnet transport) ----
  # All entries below are in crates pulled EXCLUSIVELY by the optional `nym`
  # feature (the nym-sdk transitive tree, pinned at rev 7cee643). Verified with
  # `cargo tree`: every one is ABSENT from both the default build AND the `tor`
  # build — a user only encounters them by opting into the heavy Nym transport
  # ("bring your own Nym"). Upstream nym pins these exact versions, so they can't
  # be bumped without forking much of nym's dependency tree.
  #
  # Crucially, NONE touch talkrypt's load-bearing crypto: the content layer is
  # ML-KEM-1024 + ML-DSA-87 via RustCrypto (`ml-kem`/`ml-dsa`), NOT libcrux, and
  # rides ABOVE the transport. Residual risk is scoped to the opt-in Nym
  # transport's own metadata/routing/credential layer. quinn-proto's advisory
  # (RUSTSEC-2026-0185) was instead FIXED by upgrading to 0.11.15 — not ignored.
  # Re-review and drop these when the nym-sdk pin is bumped to a rev with updated
  # deps. See the `nym-transport-decision` memory + SECURITY-AUDIT.
  "RUSTSEC-2026-0124", # libcrux-chacha20poly1305 0.0.7 — panic on overlong ciphertext (nym crypto)
  "RUSTSEC-2026-0125", # libcrux-ml-dsa 0.0.8 — AVX2 sig-verify edge case (nym's PQ, not ours)
  "RUSTSEC-2026-0126", # libcrux-ml-dsa 0.0.8 — related unsoundness (nym's PQ, not ours)
  "RUSTSEC-2026-0194", # quick-xml 0.39.4 — quadratic attribute parsing (nym XML/cosmos stack)
  "RUSTSEC-2026-0195", # quick-xml 0.39.4 — related DoS (nym XML/cosmos stack)
  "RUSTSEC-2026-0098", # rustls-webpki 0.101.7 — via nym's reqwest/rustls 0.21 (NOT Arti's rustls)
  "RUSTSEC-2026-0099", # rustls-webpki 0.101.7 — same nym-only path
  "RUSTSEC-2026-0104", # rustls-webpki 0.101.7 — same nym-only path
  "RUSTSEC-2025-0141", # bincode 1.3.3 / 2.0.1 — nym serialization; not in default/tor builds

  # ---- Unmaintained-crate notices (NOT vulnerabilities) ----
  # cargo-deny errors on "unmaintained" advisories; cargo-audit treats them as
  # warnings. These are transitive deps with no known vulnerability — just no
  # active upkeep — so they don't gate a release. Revisit if a real advisory
  # lands or a maintained replacement propagates upstream.
  "RUSTSEC-2024-0436", # paste 1.0.15 — unmaintained proc-macro (transitive; no CVE)
  "RUSTSEC-2026-0192", # ttf-parser 0.25.1 — unmaintained (via egui bundled-font parsing)
  "RUSTSEC-2024-0388", # derivative 2.2.0 — unmaintained derive helper (transitive)
]

[licenses]
# talkrypt is Apache-2.0; only permissive, audit-friendly licenses are allowed.
version = 2
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "MPL-2.0",
  "CC0-1.0",
  "BSL-1.0",
  # Font licenses for egui's bundled default fonts (desktop `default_fonts`):
  # permissive, redistribution-friendly, and standard for embedded typefaces.
  "OFL-1.1",          # SIL Open Font License (e.g. bundled UI fonts)
  "Ubuntu-font-1.0",  # Ubuntu Font License (bundled font)
  # Public-domain dedication (equivalent to CC0), used by a few small deps.
  "Unlicense",
]
confidence-threshold = 0.9
# Per-crate license clarifications go here if a crate's license is unclear.
exceptions = []

[bans]
# Warn (don't fail) on duplicate versions — a large async/crypto tree pulls a
# few; track them but don't block. Flip to "deny" once the tree is deduplicated.
multiple-versions = "warn"
wildcards = "deny"          # no external `version = "*"` deps — break reproducibility
# But the workspace's own crates depend on each other by path (no version req),
# which cargo reports as a wildcard. Exempt path-based wildcards — they are
# internal, not an unpinned external dependency.
allow-wildcard-paths = true
# Crates that must never appear (add with a justification).
deny = []

[sources]
# Supply-chain: only crates.io. An unexpected git or alternate registry source
# (a common malicious-dependency vector) fails the check.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
