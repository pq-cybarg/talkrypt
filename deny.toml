# cargo-deny configuration — supply-chain policy for the talkrypt workspace.
# Run via `scripts/audit-deps.sh` or `cargo deny check`. Gates CI (SECURITY-AUDIT
# R-1 / F-2): a new advisory, a disallowed license, or a non-crates.io source
# fails the build. Tune the few `allow`/`ignore` lists below with a comment
# justifying each entry — never ignore an advisory silently.

[advisories]
# Use the default RustSec advisory DB. Any unfixed vulnerability fails.
version = 2
yanked = "deny"
# Per-advisory exceptions, each justified. NB: advisory tooling matches by crate
# name + version, so it cannot see source patches — an entry here may document a
# *fixed* (locally patched) dependency, not an accepted-as-is risk.
#
# >>> ZERO VULNERABILITY IGNORES. <<< Every RustSec *vulnerability* that once rode
# the nym and tor dependency trees has been FIXED, not ignored — `cargo audit`
# passes with no --ignore flags at all. In particular, the whole nym cosmos/
# credential EC stack (ecdsa 0.16 / k256·p256·p384 0.13 / bip32 0.5 / elliptic-curve
# 0.13 -> crypto-bigint 0.5.5, RUSTSEC-2026-0387) and the old nym reqwest-0.11 TLS
# cluster (rustls 0.21, rustls-webpki 0.101, h2 0.3) and the libcrux PQ crates were
# all migrated to modern released versions via the vendored patches in third-party/
# (see each crate's TALKRYPT-PATCH.md). The only entries below are the sole
# local-patch record (rsa) and *unmaintained* notices (not vulnerabilities, no fix
# available) — nothing here suppresses a real, fixable vulnerability.
ignore = [
  # (The former rsa RUSTSEC-2023-0071 ignore is gone: the advisory is no longer
  # detected against our vendored, blinded rsa — see third-party/rsa/TALKRYPT-PATCH.md
  # for the mitigation that remains in place.)

  # libsqlite3-sys 0.37.0 — RUSTSEC-2026-0459 (bundled C SQLite < 3.54.0 can return
  # uninitialized page-cache bytes when opening a DB file alongside a `-wal` with a
  # mismatched page size). UPSTREAM-PINNED, not accepted-as-is: the fix is a newer
  # bundled SQLite (libsqlite3-sys >= 0.38), but Arti's rusqlite 0.39 (tor-dirmgr)
  # caps libsqlite3-sys at ^0.37 — it can't be bumped without moving Arti. The
  # attack vector is LOCAL and requires the victim to open an attacker-CRAFTED
  # database+`-wal` pair; talkrypt only ever opens databases IT creates (Arti's
  # on-disk directory cache under `tor`; nym's credential store under `nym`), never
  # attacker-supplied files, so the precondition isn't met in our threat model.
  # tor-only + nym-only (absent from the default build). Drop the moment Arti bumps
  # rusqlite/libsqlite3-sys to a SQLite >= 3.54.0 bundle.
  "RUSTSEC-2026-0459",

  # ---- Unmaintained-crate notices (NOT vulnerabilities; no fix available) ----
  # cargo-deny errors on "unmaintained" advisories; cargo-audit treats them as
  # warnings. These are transitive deps with no known vulnerability — just no
  # active upkeep — so they don't gate a release. Each is verified present in the
  # current graph; revisit when a maintained replacement propagates upstream.
  "RUSTSEC-2024-0436", # paste 1.0.15 — unmaintained proc-macro (transitive; no CVE)
  "RUSTSEC-2026-0192", # ttf-parser 0.25.1 — unmaintained (via egui bundled-font parsing)
  "RUSTSEC-2026-0370", # zvariant — unmaintained (zbus desktop-notification stack)
  "RUSTSEC-2026-0371", # zbus_names — unmaintained (zbus stack)
  "RUSTSEC-2026-0372", # zvariant_derive — unmaintained (zbus stack)
  "RUSTSEC-2026-0374", # basic-toml — unmaintained (transitive)
]

[licenses]
# talkrypt is Apache-2.0; only permissive, audit-friendly licenses are allowed.
version = 2
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "MPL-2.0",
  "CC0-1.0",
  "BSL-1.0",
  # Font licenses for egui's bundled default fonts (desktop `default_fonts`):
  # permissive, redistribution-friendly, and standard for embedded typefaces.
  "OFL-1.1",          # SIL Open Font License (e.g. bundled UI fonts)
  "Ubuntu-font-1.0",  # Ubuntu Font License (bundled font)
  # Public-domain dedication (equivalent to CC0), used by a few small deps.
  "Unlicense",
]
confidence-threshold = 0.9
# Per-crate license clarifications go here if a crate's license is unclear.
exceptions = []

[bans]
# Warn (don't fail) on duplicate versions — a large async/crypto tree pulls a
# few; track them but don't block. Flip to "deny" once the tree is deduplicated.
multiple-versions = "warn"
wildcards = "deny"          # no external `version = "*"` deps — break reproducibility
# But the workspace's own crates depend on each other by path (no version req),
# which cargo reports as a wildcard. Exempt path-based wildcards — they are
# internal, not an unpinned external dependency.
allow-wildcard-paths = true
# Crates that must never appear (add with a justification).
deny = []

[sources]
# Supply-chain: only crates.io. An unexpected git or alternate registry source
# (a common malicious-dependency vector) fails the check.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
